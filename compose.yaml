services:
  app:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    networks:
      - default
      - crawler
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-newsbot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-newsbot}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DESTINATION: ${TELEGRAM_DESTINATION:-}
      TELEGRAM_SESSION_DIR: /data/telegram
      TELEGRAM_REQUEST_TIMEOUT_MS: ${TELEGRAM_REQUEST_TIMEOUT_MS:-30000}
      TELEGRAM_UPLOAD_TIMEOUT_MS: ${TELEGRAM_UPLOAD_TIMEOUT_MS:-300000}
      PI_AUTH_DIR: /data/pi
      PI_AUTH_PATH: /data/pi/auth.json
      MODEL_USAGE_OUTBOX_DIR: ${MODEL_USAGE_OUTBOX_DIR:-/data/pi/usage-outbox}
      MODEL_USAGE_RETRY_MS: ${MODEL_USAGE_RETRY_MS:-30000}
      PUBLICATION_READY_INTERVAL_MS: ${PUBLICATION_READY_INTERVAL_MS:-5000}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_URL: ${JEV_DOCKER_URL:-http://host.docker.internal:8765}
      EMBEDDING_URL: ${EMBEDDING_DOCKER_URL:-http://host.docker.internal:11434}
      JEV_MODEL: ${JEV_MODEL:-autojev}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:latest}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-4096}
      NEWS_SUMMARY_MAX_CHARS: ${NEWS_SUMMARY_MAX_CHARS:-1000}
      NEWS_PI_PROVIDER: ${NEWS_PI_PROVIDER:-openai-codex}
      NEWS_PI_MODEL: ${NEWS_PI_MODEL:-gpt-6-luna}
      GROUPING_MAX_PROMPT_BYTES: ${GROUPING_MAX_PROMPT_BYTES:-98304}
      GROUPING_MAX_CANDIDATES: ${GROUPING_MAX_CANDIDATES:-32}
      PROCESSING_SLICE_MS: ${PROCESSING_SLICE_MS:-120000}
      ALLOW_PRIVATE_INFERENCE: ${ALLOW_PRIVATE_INFERENCE:-false}
      MEDIA_SUMMARY_MAX_IMAGES: ${MEDIA_SUMMARY_MAX_IMAGES:-10}
      MEDIA_VIDEO_DURATION_TOLERANCE: ${MEDIA_VIDEO_DURATION_TOLERANCE:-0.2}
      RESEARCH_SEARCH_URL: ${RESEARCH_SEARCH_URL:-}
      RESEARCH_SEARCH_TOKEN: ${RESEARCH_SEARCH_TOKEN:-}
      RESEARCH_FETCH_TIMEOUT_MS: ${RESEARCH_FETCH_TIMEOUT_MS:-15000}
      RESEARCH_FETCH_MAX_BYTES: ${RESEARCH_FETCH_MAX_BYTES:-1000000}
      RESEARCH_CRAWLER_URL: http://crawl4ai:11235
      RESEARCH_CRAWLER_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in .env}
      RESEARCH_CRAWLER_TIMEOUT_MS: ${RESEARCH_CRAWLER_TIMEOUT_MS:-60000}
      RESEARCH_CRAWLER_MAX_BYTES: ${RESEARCH_CRAWLER_MAX_BYTES:-5000000}
      RESEARCH_PREFERRED_DOMAINS: ${RESEARCH_PREFERRED_DOMAINS:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - telegram_sessions:/data/telegram
      - pi_auth:/data/pi
      - media_pair_cache:/app/tmp/media-pair-cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const host=(process.env.APP_ALLOWED_HOSTS||'').split(',').map(s=>s.trim()).find(Boolean)||'127.0.0.1:3000';
          const req=require('node:http').get({hostname:'127.0.0.1',port:3000,path:'/api/health',headers:{Host:host},timeout:5000},
          res=>{res.resume();res.on('end',()=>process.exit(res.statusCode===200?0:1));});
          req.on('timeout',()=>req.destroy());req.on('error',()=>process.exit(1));
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  crawl4ai:
    build: ./deploy/crawl4ai
    restart: unless-stopped
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in .env}
    networks:
      - crawler
    mem_limit: 1536m
    cpus: 2.0
    shm_size: 256m
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-newsbot}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  crawler:
volumes:
  postgres_data:
  telegram_sessions:
  pi_auth:
  media_pair_cache:
